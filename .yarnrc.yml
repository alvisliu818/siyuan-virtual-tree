# Yarn 4 Plug'n'Play（2026-10 迁移，替代 npm + node_modules；与 obsidian-my-obsidian 同约定）
nodeLinker: pnp

# 源:npmmirror(与 npm 侧一致)。yarn 默认走 registry.yarnpkg.com(=npmjs),
# 本机直连会长时间无响应(实测卡死 17 分钟),必须显式换源。
npmRegistryServer: "https://registry.npmmirror.com"

# 包 cache 落全局目录（不进公开仓），与 obsidian 仓共用同一份
enableGlobalCache: true
globalFolder: E:/HOME/Code/.yarn-global

# 允许 node-pty / zeromq 等带构建脚本的包执行 install 脚本（默认 true，显式声明）。
# 带脚本的包会自动 unplug 到磁盘（原生模块本来就进不了 zip）
enableScripts: true
