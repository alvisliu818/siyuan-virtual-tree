approvedGitRepositories:
  - "**"

enableGlobalCache: true

enableScripts: true

globalFolder: "E:/HOME/Code/.yarn-global"

# PnP 的 unplugged(带 postinstall 产物的原生包 / 需整目录复制的包)默认放在
# 项目内 ./.yarn/unplugged(约 182MB)。与 cache 一样统一放到 globalFolder,
# 让项目目录只留源码与构建产物。改这里后必须重新 yarn install 生成 .pnp.cjs。
pnpUnpluggedFolder: "E:/HOME/Code/.yarn-global/unplugged"

nodeLinker: pnp

npmMinimalAgeGate: 0

npmRegistryServer: "https://registry.npmmirror.com"
