approvedGitRepositories:
  - "**"

enableGlobalCache: true

enableScripts: true

globalFolder: "E:/HOME/Code/.yarn-global"

# unplugged 用独立子目录,不指向多项目共享的 .yarn-global/unplugged ——
# yarn install 会按本项目 lockfile 清理 pnpUnpluggedFolder 里「不属于本项目」
# 的条目,共用会删掉 obsidian-my-obsidian 等项目的解包内容。
pnpUnpluggedFolder: "E:/HOME/Code/.yarn-global/unplugged-siyuan-virtual-tree"

nodeLinker: pnp

npmMinimalAgeGate: 0

npmRegistryServer: "https://registry.npmmirror.com"
